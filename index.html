<title>Deep Sky Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D sky canvas; catalog rail on the left, object dossier on the right, tour strip along the bottom. Deliberately dark-only, like an observatory screen. */
:root{
  --void:#03050b;
  --panel:rgba(9,13,26,.82);
  --edge:rgba(158,197,255,.16);
  --ink:#e3e8f4;
  --mute:#8189a3;
  --accent:#9ec5ff;
  --c-system:#7fd8bd;--c-star:#ffd27a;--c-bh:#ff8a4c;--c-pulsar:#72e4ff;--c-nebula:#ff7ab8;--c-cluster:#c7b5ff;--c-galaxy:#b4c2ff;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--void);color:var(--ink);font-family:var(--ui);font-size:13px;overflow:hidden;touch-action:none;}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
#sky.drag{cursor:grabbing;}#sky.hover{cursor:pointer;}
.pane{position:fixed;background:var(--panel);border:1px solid var(--edge);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
button{font:inherit;color:inherit;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* header */
.head{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));pointer-events:none;display:flex;flex-direction:column;gap:2px;}
.head h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;letter-spacing:.01em;}
.head h1 i{color:var(--accent);}
.scale{font-family:var(--mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;}
.scale b{color:var(--ink);font-weight:500;}

/* catalog */
.cat{top:calc(78px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));width:270px;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;}
.cat .top{padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--edge);}
.search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:4px;color:var(--ink);font:inherit;padding:7px 10px;}
.search::placeholder{color:var(--mute);}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;border:1px solid var(--edge);background:transparent;cursor:pointer;font-size:11px;letter-spacing:.03em;color:var(--ink);}
.chip .d{width:7px;height:7px;border-radius:50%;}
.chip .n{color:var(--mute);font-family:var(--mono);font-size:10px;}
.chip[aria-pressed="false"]{opacity:.5;border-style:dashed;}
.chip[aria-pressed="false"] .d{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--mute);}
.chip[aria-pressed="false"] span:nth-child(2){text-decoration:line-through;}
.hiddenrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;margin:4px 2px;border:1px dashed var(--edge);border-radius:4px;color:var(--mute);font-size:12px;}
.hiddenrow .btn{padding:3px 9px;font-size:11px;}
.list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0;}
.list li{min-width:0;}
.item{width:100%;display:grid;grid-template-columns:8px 1fr auto;align-items:baseline;gap:9px;padding:6px 8px;border:0;background:transparent;border-radius:4px;cursor:pointer;text-align:left;}
.item:hover{background:rgba(158,197,255,.07);}
.item.sel{background:rgba(158,197,255,.14);}
.item .d{width:7px;height:7px;border-radius:50%;align-self:center;}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.item .ds{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap;}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);padding:10px 8px 4px;}
.none{color:var(--mute);padding:12px 8px;}

/* dossier */
.dos{top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;}
.dos canvas{display:block;width:100%;height:190px;background:#010208;border-bottom:1px solid var(--edge);}
.dos .body{padding:14px 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.18em;display:flex;align-items:center;gap:7px;}
.kind .d{width:7px;height:7px;border-radius:50%;}
.dos h2{margin:-4px 0 0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.02;text-wrap:balance;}
.sub{color:var(--mute);margin-top:-6px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0;}
.stats div{min-width:0;}
.stats dt{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;line-height:1.5;}
.facts li{padding-left:14px;position:relative;}
.facts li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:1px;background:var(--accent);}
.plist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px;font-size:12px;}
.plist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--edge);padding:3px 0;min-width:0;}
.plist span:last-child{font-family:var(--mono);font-size:11px;color:var(--mute);}
.sec{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);margin-bottom:-4px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--edge);background:rgba(158,197,255,.06);border-radius:4px;padding:6px 11px;cursor:pointer;font-size:12px;letter-spacing:.03em;}
.btn:hover{border-color:var(--accent);}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--edge);background:rgba(3,5,11,.7);cursor:pointer;line-height:1;font-size:15px;}

/* tours */
.tours{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;max-width:calc(100vw - 32px);overflow-x:auto;box-sizing:border-box;}
.tours .btn{white-space:nowrap;}
.tours .lbl{align-self:center;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);padding:0 6px 0 4px;white-space:nowrap;}
.hint{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);pointer-events:none;white-space:nowrap;}
.catBtn{display:none;}

@media (max-width:760px){
  .head h1{font-size:24px;}
  .catBtn{display:inline-block;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));}
  .cat{width:auto;right:calc(16px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:3;}
  .cat.closed{display:none;}
  .dos{top:auto;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));width:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:52%;z-index:4;}
  .dos canvas{height:130px;}
  .dos h2{font-size:26px;}
  .hint{display:none;}
}
@media (min-width:761px){.cat.closed{display:flex;}}
</style>
</head>
<body>

<canvas id="sky" aria-label="3D map of real stars, black holes, pulsars, nebulae and galaxies"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>

<div class="head">
  <h1>Deep Sky <i>Atlas</i></h1>
  <div class="scale" id="scale">View <b>–</b></div>
</div>
<button class="btn catBtn pane" id="catBtn" type="button" aria-expanded="false">Catalog</button>

<aside class="pane cat closed" id="cat" aria-label="Catalog">
  <div class="top">
    <input class="search" id="q" type="search" placeholder="Search Betelgeuse, TRAPPIST-1, Crab…" autocomplete="off" aria-label="Search objects">
    <div class="chips" id="chips"></div>
  </div>
  <ul class="list" id="list"></ul>
</aside>

<aside class="pane dos" id="dos" hidden aria-live="polite">
  <button class="x" id="close" type="button" aria-label="Close details">×</button>
  <canvas id="art" aria-hidden="true"></canvas>
  <div class="body" id="dbody"></div>
</aside>

<div class="hint">Drag to orbit · scroll over an object to zoom into it · click to fly there</div>
<nav class="pane tours" aria-label="Quick tours">
  <span class="lbl">Go to</span>
  <button class="btn" data-go="Solar System" type="button">Solar System</button>
  <button class="btn" data-go="Sagittarius A*" type="button">Galactic core</button>
  <button class="btn" data-go="Orion Nebula" type="button">Orion Nebula</button>
  <button class="btn" data-go="TRAPPIST-1" type="button">TRAPPIST-1</button>
  <button class="btn" data-go="@milkyway" type="button">Whole Milky Way</button>
  <button class="btn" data-go="Andromeda Galaxy" type="button">Andromeda</button>
  <button class="btn" data-go="@random" type="button">Surprise me</button>
</nav>

/* ================= math ================= */
const D2R=Math.PI/180,AU=1/63241.077,GC=[26670,0,0];
function eq2gal(ra,de,d){
  const a=ra*D2R,b=de*D2R,x=Math.cos(b)*Math.cos(a),y=Math.cos(b)*Math.sin(a),z=Math.sin(b);
  return [d*(-0.0548755604*x-0.8734370902*y-0.4838350155*z),d*(0.4941094279*x-0.4448296300*y+0.7469822445*z),d*(-0.8676661490*x-0.1980763734*y+0.4559837762*z)];
}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const css=getComputedStyle(document.documentElement);
const catCol=c=>css.getPropertyValue(CATS[c].v).trim();
/* physical sizes, in light-years */
const RSUN=7.35e-8,RE=6.74e-10,RSCH=3.12e-13;
const RS={'Solar System':1,'Proxima Centauri':.154,'Alpha Centauri A & B':1.22,"Barnard's Star":.19,'Epsilon Eridani':.74,'Tau Ceti':.79,'TRAPPIST-1':.12,'55 Cancri':.94,'51 Pegasi':1.15,'Gliese 581':.3,'LHS 1140':.21,'HR 8799':1.4,'Beta Pictoris':1.5,'TOI-700':.42,'K2-18':.41,'HD 209458':1.2,'Kepler-16':.65,'Kepler-186':.52,'Kepler-452':1.1,'Kepler-90':1.2,'WASP-12':1.6,'Sirius':1.71,'Vega':2.4,'Fomalhaut':1.84,'Arcturus':25,'Canopus':71,'Polaris':46,'Betelgeuse':760,'Antares':680,'Rigel':79,"Tabby's Star":1.58,'VY Canis Majoris':1420,'Eta Carinae':100,'WR 104':10,'R136a1':40};
const BHM={'Gaia BH1':9.6,'Gaia BH3':33,'A0620-00':6.6,'Gaia BH2':8.9,'Cygnus X-1':21,'V404 Cygni':9,'Sagittarius A*':4.3e6,'GRS 1915+105':12,'M87*':6.5e9,'TON 618':6.6e10};
const SOL={Mercury:[.38,'#b0aba3','The smallest planet; its year lasts 88 days.'],Venus:[.95,'#e9d3a0','The hottest planet, about 465 °C under thick CO₂ clouds.'],Earth:[1,'#4f8fd8','The only world known to host life.'],Mars:[.53,'#d2663e','Home of Olympus Mons, the tallest volcano in the Solar System.'],Jupiter:[11.2,'#d9b58c','More than twice as massive as all the other planets combined.'],Saturn:[9.45,'#e6d19a','Its rings are mostly water ice, only tens of metres thick in places.'],Uranus:[4,'#a3e2ea','It rolls around the Sun tipped on its side.'],Neptune:[3.88,'#5078e0','It has the fastest winds measured in the Solar System, over 2,000 km/h.']};
const PCOL={r:'#c9b49a',g:'#e6c08a',i:'#8fd0e8',c:'#9aa3b8'};
const KIND_RE={r:1.1,g:11,i:3.6,c:1.6};
O.forEach((o,i)=>{o.i=i;o.pos=eq2gal(o.ra,o.de,o.d);o.color=o.col||catCol(o.c);o.seed=hash(o.n);
  o.maxAU=o.p?Math.max(...o.p.map(p=>p[1])):0;
  if(o.c==='star'||o.c==='system')o.R=(RS[o.n]||1)*RSUN;
  if(o.c==='bh'){o.Rs=(BHM[o.n]||10)*RSCH;o.R=2.6*o.Rs;}
  if(o.c==='pulsar')o.R=1.057e-12;
  if(o.p){o.tilt=((o.seed%50)-25)*D2R;
    o.pl=o.p.map((p,k)=>{const s=o.n==='Solar System'?SOL[p[0]]:null;
      const pl={isPlanet:true,parent:o,k,au:p[1],kind:p[2],n:p[0].length<=2?o.n+' '+p[0]:p[0],re:s?s[0]:KIND_RE[p[2]],est:!s,fact:s?s[2]:null,color:s?s[1]:PCOL[p[2]],ring:p[0]==='Saturn',pos:[0,0,0]};
      pl.R=pl.re*RE;pl.view=pl.R*(pl.ring?9:5);return pl;});}
  o.view=o.sz?o.sz*(o.c==='galaxy'?3.4:o.c==='nebula'?2.6:4):o.p?Math.max(o.maxAU*AU*4,o.R*8):o.R?o.R*(o.c==='bh'?14:o.c==='pulsar'?30:6):1.6;
});
function plAngle(o,pl){return (o.seed%100)/10+pl.au*3+time*(.35*Math.pow(o.p[0][1]/pl.au,1.5)+.004);}
function updPlanets(){for(const o of O){if(!o.pl)continue;const ct=Math.cos(o.tilt),st=Math.sin(o.tilt);
  for(const pl of o.pl){const a=plAngle(o,pl),R=pl.au*AU,x=Math.cos(a)*R,y=Math.sin(a)*R;pl.off=[x,y*ct,y*st];pl.pos[0]=o.pos[0]+x;pl.pos[1]=o.pos[1]+y*ct;pl.pos[2]=o.pos[2]+y*st;}}}

/* ================= procedural Milky Way ================= */
const MW=[];// [x,y,z,group]
(function(){
  const r=rng(42);const g=()=>{let u=0;for(let i=0;i<4;i++)u+=r();return (u-2)/1.15;};
  const pitch=Math.tan(12*D2R);
  for(let k=0;k<4;k++)for(let i=0;i<5200;i++){
    const rad=3500+Math.pow(r(),.8)*48000;
    const th=k*Math.PI/2+Math.log(rad/3500)/pitch+g()*.18+Math.PI*.82;
    const sc=320+rad*.03;
    const x=GC[0]+Math.cos(th)*rad+g()*sc,y=GC[1]+Math.sin(th)*rad+g()*sc,z=g()*(180+rad*.004);
    MW.push(x,y,z,r()<.07?2:r()<.5?1:0);
  }
  for(let i=0;i<9000;i++){// diffuse disc
    const rad=Math.sqrt(r())*52000,th=r()*Math.PI*2;
    MW.push(GC[0]+Math.cos(th)*rad,GC[1]+Math.sin(th)*rad,g()*450,0);
  }
  const ba=27*D2R;
  for(let i=0;i<7000;i++){// bulge + bar
    const a=g()*4200,b=g()*1500,c=g()*1100;
    MW.push(GC[0]+a*Math.cos(ba)-b*Math.sin(ba),GC[1]+a*Math.sin(ba)+b*Math.cos(ba),c,3);
  }
})();
const MW_COL=['rgba(170,190,255,','rgba(220,228,255,','rgba(255,130,175,','rgba(255,214,160,'];
const LOCAL=[];(function(){const r=rng(7);for(let i=0;i<3500;i++){const d=Math.pow(r(),.45)*2200,th=r()*Math.PI*2,ph=Math.asin(2*r()-1);LOCAL.push(d*Math.cos(ph)*Math.cos(th),d*Math.cos(ph)*Math.sin(th),d*Math.sin(ph)*.45,r());}})();
const FAR=[];(function(){const r=rng(99);for(let i=0;i<1600;i++){const th=r()*Math.PI*2,z=2*r()-1,s=Math.sqrt(1-z*z);FAR.push(s*Math.cos(th),s*Math.sin(th),z,r());}})();
const DISTANT=[];(function(){const r=rng(5);for(let i=0;i<1400;i++){const d=3e6+Math.pow(r(),.5)*2e9,th=r()*Math.PI*2,z=2*r()-1,s=Math.sqrt(1-z*z);DISTANT.push(d*s*Math.cos(th),d*s*Math.sin(th),d*z,r());}})();

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}

function makeSprite(o,S){
  const cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');const r=rng(o.seed),c=S/2;
  g.globalCompositeOperation='lighter';

      for(let i=0;i<90;i++){const a=r()*Math.PI*2,rr=S*(.26+r()*.08);blob(g,c+Math.cos(a)*rr,c+Math.sin(a)*rr*.86,S*(.06+r()*.07),r()<.7?o.col2:o.col,.22);}
      blob(g,c,c,S*.25,o.col,.35);
    }else if(sh==='shell'){
      for(let i=0;i<140;i++){const a=r()*Math.PI*2,rr=S*(.2+r()*.2);blob(g,c+Math.cos(a)*rr,c+Math.sin(a)*rr,S*(.02+r()*.05),r()<.5?o.col:o.col2,.3);}
      blob(g,c,c,S*.22,o.col2,.18);
    }else if(sh==='bipolar'){
      for(let i=0;i<110;i++){const s=r()<.5?-1:1,t=r(),x=c+s*t*S*.38,y=c+(r()-.5)*S*.32*Math.sin(t*Math.PI)*1.4;blob(g,x,y,S*(.04+r()*.07),t<.3?o.col:o.col2,.22);}

    }else{
      for(let i=0;i<120;i++){const a=r()*Math.PI*2,rr=Math.pow(r(),.7)*S*.36;blob(g,c+Math.cos(a)*rr,c+Math.sin(a)*rr*.8,S*(.05+r()*.12),r()<.6?o.col:o.col2,sh==='dark'?.18:.16);}
      if(sh==='dark'){g.globalCompositeOperation='destination-out';for(let i=0;i<18;i++)blob(g,c+(r()-.3)*S*.2,c+S*(.05+r()*.3),S*(.08+r()*.08),'#000000',.9);}
    }
    g.globalCompositeOperation='lighter';
    for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${.4+r()*.6})`;const s=r()<.1?2:1;g.fillRect(c+(r()-.5)*S*.8,c+(r()-.5)*S*.8,s,s);}
  }else if(o.c==='galaxy'){
    if(o.shape==='spiral'||o.shape==='lenticular'){
      const flat=o.shape==='lenticular'?.22:.62;g.translate(c,c);g.scale(1,flat);
      blob(g,0,0,S*.2,'#ffe0a8',.8);
      if(o.shape==='spiral')for(let k=0;k<2;k++)for(let i=0;i<900;i++){const t=r(),rad=S*(.04+t*.42),th=k*Math.PI+Math.log(rad/(S*.04))/.32+(r()-.5)*.5;
        g.fillStyle=t>.4&&r()<.08?'rgba(255,140,190,.7)':`rgba(${190+r()*50|0},${200+r()*40|0},255,${.25+r()*.4})`;g.fillRect(Math.cos(th)*rad,Math.sin(th)*rad,1.6,1.6);}
      else{blob(g,0,0,S*.45,'#dfe4ff',.28);g.globalCompositeOperation='source-over';g.fillStyle='rgba(20,10,5,.75)';g.fillRect(-S*.46,-S*.02,S*.92,S*.05);}
      g.setTransform(1,0,0,1,0,0);
    }else if(o.shape==='elliptical'){
      const gr=g.createRadialGradient(c,c,0,c,c,S*.48);gr.addColorStop(0,'rgba(255,236,200,.95)');gr.addColorStop(.25,'rgba(255,215,170,.4)');gr.addColorStop(1,'rgba(255,200,150,0)');
      g.translate(c,c);g.scale(1,.8);g.translate(-c,-c);g.fillStyle=gr;g.fillRect(0,0,S,S);g.setTransform(1,0,0,1,0,0);
      if(o.n==='Centaurus A'){g.globalCompositeOperation='source-over';g.fillStyle='rgba(15,8,4,.8)';g.save();g.translate(c,c);g.rotate(-.5);g.fillRect(-S*.3,-S*.03,S*.6,S*.06);g.restore();}

    }else{
      for(let i=0;i<60;i++)blob(g,c+(r()-.5)*S*.6,c+(r()-.5)*S*.4,S*(.04+r()*.1),r()<.2?'#ff8ab8':'#c8d6ff',.22);

    }

    const glob=o.sub.indexOf('Globular')>=0;

    for(let i=0;i<(glob?1400:90);i++){const rr=(glob?Math.pow(r(),2.2):Math.pow(r(),.9))*S*.45,a=r()*Math.PI*2,s=glob?1:1+r()*2.2;

      g.beginPath();g.arc(c+Math.cos(a)*rr,c+Math.sin(a)*rr,s,0,7);g.fill();}
    if(!glob)for(let i=0;i<14;i++)blob(g,c+(r()-.5)*S*.6,c+(r()-.5)*S*.6,S*.12,'#6f8fff',.08);
  }
  return cv;
}

const cam={tx:0,ty:0,tz:0,yaw:-2.2,pitch:.42,dist:5200};
let fly=null,idle=0,time=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let B={};
function basis(){

  const dx=cp*cy,dy=cp*sy,dz=sp;

  const fx=-dx,fy=-dy,fz=-dz;let rx=fy,ry=-fx;const rl=Math.hypot(rx,ry)||1;rx/=rl;ry/=rl;

function proj(x,y,z){return projRel(x-B.ox,y-B.oy,z-B.oz);}
const MIN_D=1e-13,MAX_D=3e10;
let focus=null; // object the camera orbits and follows

function viewAngles(o){

  const n=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];};

const ptrs=new Map();let downAt=null,pinch0=0,dragMoved=false,hover=null;
sky.addEventListener('pointerdown',e=>{sky.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);downAt=[e.clientX,e.clientY];dragMoved=false;idle=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);}
  sky.classList.add('drag');});
sky.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){hover=pick(e.clientX,e.clientY);sky.classList.toggle('hover',!!hover);return;}
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)dragMoved=true;
  if(ptrs.size===1){cam.yaw-=(e.clientX-prev[0])*.006;cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch+(e.clientY-prev[1])*.006));}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinch0>0){const k=pinch0/d;
      if(k<1){const o=pick((a[0]+b[0])/2,(a[1]+b[1])/2,40);if(o&&o!==focus&&!(fly&&fly.obj===o)){flyTo(o,cam.dist*.7,.7);pinch0=d;return;}}
      if(fly)fly.l1=Math.log(clampD(Math.exp(fly.l1)*k));else cam.dist=clampD(cam.dist*k);}
    pinch0=d;}
  idle=0;
});
function up(e){ptrs.delete(e.pointerId);sky.classList.remove('drag');
  if(e.type==='pointerup'&&!dragMoved&&ptrs.size===0&&downAt){const o=pick(e.clientX,e.clientY);if(o)select(o,true);}
  if(ptrs.size<2)pinch0=0;downAt=null;}
sky.addEventListener('pointerup',up);sky.addEventListener('pointercancel',up);
sky.addEventListener('wheel',e=>{e.preventDefault();idle=0;
  const k=Math.exp(Math.max(-120,Math.min(120,e.deltaY))*.0018);
  if(e.deltaY<0){const o=pick(e.clientX,e.clientY,40);
    if(o&&o!==focus&&!(fly&&fly.obj===o)){flyTo(o,cam.dist*.7,.7);return;}}
  if(fly){fly.l1=Math.log(clampD(Math.exp(fly.l1)*k));return;}
  cam.dist=clampD(cam.dist*k);
},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowLeft')cam.yaw+=.08;else if(k==='ArrowRight')cam.yaw-=.08;
  else if(k==='ArrowUp')cam.pitch=Math.min(1.5,cam.pitch+.06);else if(k==='ArrowDown')cam.pitch=Math.max(-1.5,cam.pitch-.06);
  else if(k==='+'||k==='=')cam.dist=clampD(cam.dist/1.3);else if(k==='-'||k==='_')cam.dist=clampD(cam.dist*1.3);
  else if(k==='Escape')deselect();else return;
  idle=0;
});

function fmtD(d){
  if(d===0)return 'here';
  if(d>=1e9)return (d/1e9).toFixed(1)+' billion ly';
  if(d>=1e6)return (d/1e6).toFixed(d>=1e7?0:1)+' million ly';
  return Math.round(d).toLocaleString()+' ly';
}
function fmtSpan(d){
  if(d<1e-13)return Math.round(d*9.4607e15).toLocaleString()+' m';
  if(d<1e-5)return Math.round(d*9.4607e12).toLocaleString()+' km';
  if(d<.02)return Math.round(d/AU).toLocaleString()+' AU';
  if(d<10)return d.toFixed(2)+' ly';
  if(d<1e6)return Math.round(d).toLocaleString()+' ly';
  if(d<1e9)return (d/1e6).toFixed(1)+' million ly';
  return (d/1e9).toFixed(1)+' billion ly';
}

    const t=document.createElement('span');
    t.textContent=(off.length?'Hidden: '+off.map(c=>CATS[c].label).join(', '):'')+(off.length&&query?' · ':'')+(query?'Search: "'+query+'"':'');

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function select(o,go){

/* ================= drawing helpers ================= */
function glow(g,x,y,rad,col,core){
  const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,'rgba(255,255,255,'+(core||1)+')');gr.addColorStop(.18,rgba(col,.9));gr.addColorStop(.45,rgba(col,.25));gr.addColorStop(1,rgba(col,0));

}
function drawBH(g,x,y,R,tilt,t){
  // back half of disk
  g.save();g.translate(x,y);
  const ring=(from,to)=>{for(let i=0;i<4;i++){const rr=R*(1.6+i*.55);g.strokeStyle=`rgba(255,${150+i*20},${70+i*15},${.55-i*.11})`;g.lineWidth=R*(.42-i*.06);
    g.beginPath();g.ellipse(0,0,rr,rr*tilt,0,from,to);g.stroke();}};
  ring(Math.PI,Math.PI*2);
  // lensed halo above
  g.strokeStyle='rgba(255,190,120,.45)';g.lineWidth=R*.25;g.beginPath();g.ellipse(0,-R*.1,R*1.45,R*1.25,0,Math.PI*1.05,Math.PI*1.95);g.stroke();

  g.fillStyle=pr;g.beginPath();g.arc(0,0,R*1.25,0,7);g.fill();
  g.fillStyle='#000';g.beginPath();g.arc(0,0,R,0,7);g.fill();

  const db=g.createLinearGradient(-R*3,0,R*3,0);db.addColorStop(0,'rgba(255,240,210,.35)');db.addColorStop(.5,'rgba(255,240,210,0)');

}
function drawPulsar(g,x,y,R,t,spin,col){
  const a=t*Math.min(6,1.2/Math.max(spin,.2))+0.3;

  g.strokeStyle=rgba(col,.15);g.lineWidth=1;
  for(let i=1;i<=3;i++){g.beginPath();g.ellipse(0,0,R*i*1.6,R*i*3.2,a*.25+.4,0,7);g.stroke();}
  g.rotate(a);

function drawStarBall(g,x,y,R,col,t,seed,big){

function drawSystem(g,o,x,y,maxR,starR,hl){

function drawPlanetBall(g,x,y,R,col,lx,ly,ring){

    g.strokeStyle='rgba(200,180,140,.35)';g.lineWidth=R*.12;g.beginPath();g.ellipse(x,y,R*2.35,R*.66,-.3,a,b);g.stroke();};

  g.save();g.beginPath();g.arc(x,y,R,0,7);g.clip();

    g.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<9;i++){g.beginPath();g.ellipse(x+(r()-.5)*R*1.6,y+(r()-.5)*R*1.6,R*(.2+r()*.3),R*.06,r(),0,7);g.fill();}}

function drawOrbits3D(o){
  const ct=Math.cos(o.tilt),st=Math.sin(o.tilt);
  for(const pl of o.pl){
    const R=pl.au*AU;ctx.strokeStyle=sel===pl?'rgba(127,216,189,.7)':pl.kind==='c'?'rgba(158,197,255,.2)':'rgba(158,197,255,.32)';ctx.lineWidth=1;
    if(pl.kind==='c')ctx.setLineDash([3,5]);

    for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,x=Math.cos(a)*R,y=Math.sin(a)*R;const p=proj(o.pos[0]+x,o.pos[1]+y*ct,o.pos[2]+y*st);
      if(!p){pen=false;continue;}if(!pen){ctx.moveTo(p[0],p[1]);pen=true;}else ctx.lineTo(p[0],p[1]);}

  }

/* ================= label layout ================= */
let boxes=[];
function tryLabel(text,x,y,col,bold,force){
  ctx.font=(bold?'600 12px ':'500 11px ')+'"IBM Plex Sans Condensed","Arial Narrow",sans-serif';
  const w=ctx.measureText(text).width+6,h=14,bx=x-w/2,by=y-h+2;
  if(!force)for(const b of boxes)if(bx<b[0]+b[2]&&bx+w>b[0]&&by<b[1]+b[3]&&by+h>b[1])return false;
  boxes.push([bx,by,w,h]);
  ctx.fillStyle='rgba(3,5,11,.55)';ctx.fillRect(bx,by,w,h);
  ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(text,x,y);return true;
}

/* ================= picking ================= */
let screenObjs=[];
function pick(mx,my,lim){let best=null,bd=lim||22;for(const s of screenObjs){const d=Math.hypot(s.x-mx,s.y-my)-Math.min(s.r,60)*.6;if(d<bd){bd=d;best=s.o;}}return best;}

/* ================= main render ================= */
function draw(){
  basis();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#03050b';ctx.fillRect(0,0,W,H);
  // sky dome
  for(let i=0;i<FAR.length;i+=4){
    const X=FAR[i],Y=FAR[i+1],Z=FAR[i+2];const zc=X*B.fx+Y*B.fy+Z*B.fz;if(zc<=.05)continue;
    const sx=W/2+F*(X*B.rx+Y*B.ry)/zc,sy=H/2-F*(X*B.ux+Y*B.uy+Z*B.uz)/zc;
    ctx.fillStyle=`rgba(220,228,255,${.12+FAR[i+3]*.25})`;ctx.fillRect(sx,sy,1,1);
  }
  const L=Math.log10(cam.dist);
  // distant galaxies field
  const aD=Math.max(0,Math.min(1,(L-6.3)/1.2));
  if(aD>0)for(let i=0;i<DISTANT.length;i+=4){const p=proj(DISTANT[i],DISTANT[i+1],DISTANT[i+2]);if(!p)continue;ctx.fillStyle=`rgba(200,190,255,${aD*(.25+DISTANT[i+3]*.5)})`;const s=1+DISTANT[i+3]*1.5;ctx.fillRect(p[0],p[1],s,s);}
  // milky way
  const aMW=Math.max(0,Math.min(1,(L-2.4)/1.4));
  if(aMW>0){
    ctx.globalCompositeOperation='lighter';
    const fade=L>6?Math.max(.25,1-(L-6)*.4):1;
    for(let gidx=0;gidx<4;gidx++){
      ctx.fillStyle=MW_COL[gidx]+(aMW*fade*(gidx===3?.5:gidx===2?.55:.32))+')';
      for(let i=0;i<MW.length;i+=4){
        if(MW[i+3]!==gidx)continue;
        const X=(MW[i]-B.ox)-B.cx,Y=(MW[i+1]-B.oy)-B.cy,Z=(MW[i+2]-B.oz)-B.cz;const zc=X*B.fx+Y*B.fy+Z*B.fz;if(zc<=B.near)continue;
        const sx=W/2+F*(X*B.rx+Y*B.ry)/zc,sy=H/2-F*(X*B.ux+Y*B.uy+Z*B.uz)/zc;
        if(sx<0||sy<0||sx>W||sy>H)continue;
        const s=gidx===3?1.6:1.3;ctx.fillRect(sx,sy,s,s);
      }
    }
    // core glow
    const c=proj(GC[0],GC[1],GC[2]);
    if(c){const R=Math.max(6,F*6000/c[2]);const gr=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],R);gr.addColorStop(0,`rgba(255,220,170,${.45*aMW})`);gr.addColorStop(1,'rgba(255,200,150,0)');ctx.fillStyle=gr;ctx.fillRect(c[0]-R,c[1]-R,R*2,R*2);}
    ctx.globalCompositeOperation='source-over';
  }
  // local stars around the Sun's neighbourhood
  const aL=Math.max(0,Math.min(1,(4.1-L)/1.2));
  if(aL>0)for(let i=0;i<LOCAL.length;i+=4){const p=proj(LOCAL[i],LOCAL[i+1],LOCAL[i+2]);if(!p)continue;const b=LOCAL[i+3];ctx.fillStyle=b>.9?`rgba(255,210,160,${aL*.7})`:`rgba(215,225,255,${aL*(.25+b*.4)})`;const s=b>.95?1.8:1.1;ctx.fillRect(p[0],p[1],s,s);}

  ringScale();

  // objects (catalog entries plus planets of nearby systems), drawn far to near
  boxes=[];screenObjs=[];
  const items=[],systems=[],M=Math.max(W,H)*4;
  for(const o of O){
    if(!visible(o))continue;const p=proj(o.pos[0],o.pos[1],o.pos[2]);if(!p)continue;
    const z=p[2];let r;
    if(o.spr)r=Math.max(o.c==='galaxy'?7:5,F*o.sz/z);
    else if(o.c==='bh')r=Math.max(3,F*o.R/z);
    else if(o.c==='pulsar')r=Math.max(2,F*o.R/z);
    else r=Math.max(o.big?4.5:3.2,F*o.R/z);
    r=Math.min(r,M);
    const m=r*(o.c==='bh'?3.6:o.spr?1.3:1.2)+140;
    if(p[0]<-m||p[1]<-m||p[0]>W+m||p[1]>H+m)continue;
    const far=z>cam.dist*3000&&o!==sel&&o!==hover&&!(o.spr&&r>8);
    items.push({o,x:p[0],y:p[1],z,r:far?2:r,far});
    if(o.pl){const ext=F*o.maxAU*AU/z;
      if(ext>18){if(cam.dist>o.maxAU*AU*.003)systems.push(o);
        for(const pl of o.pl){const q=proj(pl.pos[0],pl.pos[1],pl.pos[2]);if(!q)continue;
          items.push({o:pl,x:q[0],y:q[1],z:q[2],r:Math.min(M,Math.max(2,F*pl.R/q[2])),hx:p[0],hy:p[1]});}}}
  }
  for(const o of systems)drawOrbits3D(o);
  let glo=null;
  if(focus){const z=Math.hypot(B.cx-(focus.pos[0]-B.ox),B.cy-(focus.pos[1]-B.oy),B.cz-(focus.pos[2]-B.oz));if(glSetup(focus,z))glo=focus;}
  items.sort((a,b)=>b.z-a.z);
  for(const it of items){
    const {o,x,y,r}=it;
    if(o===glo&&!o.spr){it.gl=true;screenObjs.push({o,x,y,r});continue;}
    if(it.far){ctx.fillStyle=rgba(o.c==='system'||o.c==='star'?o.color:catCol(o.c),.75);ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill();}
    else if(o.isPlanet)drawPlanetBall(ctx,x,y,r,o.color,it.hx-x,it.hy-y,o.ring);
    else if(o.spr){
      const pr=F*o.sz/it.z,s=r*2.3,big=Math.max(W,H);
      let a=Math.min(1,.55+pr*.02);if(pr>big)a*=Math.max(.18,big/pr);if(o===glo)a*=1-glFade*.85;
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.drawImage(o.spr,x-s/2,y-s/2,s,s);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      if(pr<5){ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();}
      if(o===glo)it.gl=true;
    }
    else if(o.c==='bh')drawBH(ctx,x,y,r,.32,time);
    else if(o.c==='pulsar')drawPulsar(ctx,x,y,r,time,o.spin||1,catCol('pulsar'));
    else if(r>3.4)drawStarBall(ctx,x,y,r,o.color,time,o.seed,r>24);
    else glow(ctx,x,y,r*(o.big?4:3.2),o.color,1);
    if(sel===o&&!(o===glo&&glFade>.5)){ctx.strokeStyle=o.isPlanet?catCol('system'):catCol(o.c);ctx.lineWidth=1.2;const rr=Math.min(Math.max(r*(o.c==='bh'?3.4:1.15)+8,14),Math.max(W,H));ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,rr,time*.4,time*.4+Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
    screenObjs.push({o,x,y,r});
  }
  // labels: selected, hovered, then biggest and nearest
  items.sort((a,b)=>(b.o===sel)-(a.o===sel)||(b.o===hover)-(a.o===hover)||(b.r-a.r)||(a.z-b.z));
  for(const s of items){
    if(s.far||s.gl||(glo&&!s.o.isPlanet&&s.o!==sel))continue;
    const ext=s.o.c==='bh'?s.r*1.2:s.o.ring?s.r*.7:s.r;
    const off=Math.max(12,Math.min(ext*1.1,H*.4))+12;
    const col=s.o===sel||s.o===hover?'#ffffff':s.o.isPlanet?'rgba(190,205,235,.9)':catCol(s.o.c);
    tryLabel(s.o.n,s.x,s.y+off,col,s.o===sel,s.o===sel);
  }
  hud();
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<2?1:m<5?2:5)*p;}
function ringScale(){
  const R=niceStep(cam.dist*.45);
  const tx=cam.tx-B.ox,ty=cam.ty-B.oy,tz=cam.tz-B.oz;
  const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts.push(projRel(tx+Math.cos(a)*R,ty+Math.sin(a)*R,tz));}
  ctx.strokeStyle='rgba(158,197,255,.14)';ctx.lineWidth=1;ctx.beginPath();let pen=false;
  for(const p of pts){if(!p){pen=false;continue;}if(!pen){ctx.moveTo(p[0],p[1]);pen=true;}else ctx.lineTo(p[0],p[1]);}ctx.stroke();
  const lp=projRel(tx+R*Math.cos(cam.yaw+Math.PI*.5),ty+R*Math.sin(cam.yaw+Math.PI*.5),tz);
  if(lp){ctx.font='400 10px "IBM Plex Mono",ui-monospace,monospace';ctx.fillStyle='rgba(158,197,255,.55)';ctx.textAlign='center';ctx.fillText('radius '+fmtSpan(R),lp[0],lp[1]-4);}
}
const scaleEl=document.getElementById('scale');let lastHud='';
function regionName(){
  const d=cam.dist,fromSun=Math.hypot(cam.tx,cam.ty,cam.tz);
  if(focus&&!fly&&d<Math.max((focus.R||0)*80,focus.sz?focus.sz*3:0,focus.pl?focus.maxAU*AU*3:0))return 'near '+focus.n;
  if(d<.01)return 'planetary system';
  if(d<300)return fromSun<200?'solar neighbourhood':'stellar neighbourhood';
  if(d<8e4)return 'Milky Way';
  if(d<6e6)return 'Local Group';
  if(d<2e8)return 'Virgo Supercluster';
  return 'observable universe';
}
function hud(){
  const s=`View <b>${fmtSpan(cam.dist*2*Math.tan(30*D2R))}</b> across · ${regionName()}`;
  if(s!==lastHud){scaleEl.innerHTML=s;lastHud=s;}
}

/* ================= dossier illustration ================= */
function drawArt(){
  if(!sel||!AW)return;const g=actx,o=sel;g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#010208';g.fillRect(0,0,AW,AH);
  const r=rng(o.seed+3);for(let i=0;i<120;i++){g.fillStyle=`rgba(220,228,255,${.15+r()*.4})`;g.fillRect(r()*AW,r()*AH,1,1);}
  const cx=AW/2,cy=AH/2;
  if(o.isPlanet){drawPlanetBall(g,cx,cy,AH*(o.ring?.26:.34),o.color,-1,-.35,o.ring);}

}

const glc=document.getElementById('gl');

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;idle+=dt;
  updPlanets();
  stepFly(dt);
  if(focus&&focus.isPlanet){const a=plAngle(focus.parent,focus);if(focus._la!=null&&!fly)cam.yaw+=a-focus._la;focus._la=a;}
  if(!fly&&focus){cam.tx=focus.pos[0];cam.ty=focus.pos[1];cam.tz=focus.pos[2];}
  if(!reduce&&!fly&&idle>5&&ptrs.size===0)cam.yaw+=dt*.025;
  draw();glRender();drawArt();
  requestAnimationFrame(frame);
}
function start(data){
  if(data&&data.cam)Object.assign(cam,data.cam);
  if(innerWidth>760)toggleCat(true);
  renderList();
  if(data&&data.sel!=null&&O[data.sel])select(O[data.sel],false);
  else select(O.find(o=>o.n==='Orion Nebula'),false);
  requestAnimationFrame(t=>{last=t;frame(t);});
}
start({});
})();
</script>
