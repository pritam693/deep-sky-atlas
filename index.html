<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A universe simulator: a 3D atlas of real stars, black holes, pulsars, nebulae and galaxies with a time machine and star life cycles, a gravity sandbox, and the history of the cosmos from the Big Bang to the far future.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2303050b'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='4' fill='none' stroke='%23ff8a4c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23000' stroke='%23ffd27a'/%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Deep Sky Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D sky canvas; catalog rail on the left, object dossier on the right, tour strip along the bottom. Deliberately dark-only, like an observatory screen. */
:root{
  --void:#03050b;
  --panel:rgba(9,13,26,.82);
  --edge:rgba(158,197,255,.16);
  --ink:#e3e8f4;
  --mute:#8189a3;
  --accent:#9ec5ff;
  --c-system:#7fd8bd;--c-star:#ffd27a;--c-bh:#ff8a4c;--c-pulsar:#72e4ff;--c-nebula:#ff7ab8;--c-cluster:#c7b5ff;--c-galaxy:#b4c2ff;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{background:var(--void);color:var(--ink);font-family:var(--ui);font-size:13px;overflow:hidden;touch-action:none;}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
#sky.drag{cursor:grabbing;}#sky.hover{cursor:pointer;}
.pane{position:fixed;background:var(--panel);border:1px solid var(--edge);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
button{font:inherit;color:inherit;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* header */
.head{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));pointer-events:none;display:flex;flex-direction:column;gap:2px;}
.head h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;letter-spacing:.01em;}
.head h1 i{color:var(--accent);}
.scale{font-family:var(--mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 140px);}
.scale b{color:var(--ink);font-weight:500;}

/* catalog */
.cat{top:calc(78px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));width:270px;bottom:calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;}
.cat .top{padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--edge);}
.search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:4px;color:var(--ink);font:inherit;padding:7px 10px;}
.search::placeholder{color:var(--mute);}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;border:1px solid var(--edge);background:transparent;cursor:pointer;font-size:11px;letter-spacing:.03em;color:var(--ink);}
.chip .d{width:7px;height:7px;border-radius:50%;}
.chip .n{color:var(--mute);font-family:var(--mono);font-size:10px;}
.chip[aria-pressed="false"]{opacity:.5;border-style:dashed;}
.chip[aria-pressed="false"] .d{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--mute);}
.chip[aria-pressed="false"] span:nth-child(2){text-decoration:line-through;}
.hiddenrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;margin:4px 2px;border:1px dashed var(--edge);border-radius:4px;color:var(--mute);font-size:12px;}
.hiddenrow .btn{padding:3px 9px;font-size:11px;}
.list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0;}
.list li{min-width:0;}
.item{width:100%;display:grid;grid-template-columns:8px 1fr auto;align-items:baseline;gap:9px;padding:6px 8px;border:0;background:transparent;border-radius:4px;cursor:pointer;text-align:left;}
.item:hover{background:rgba(158,197,255,.07);}
.item.sel{background:rgba(158,197,255,.14);}
.item .d{width:7px;height:7px;border-radius:50%;align-self:center;}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.item .ds{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap;}
.grp{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);padding:10px 8px 4px;}
.none{color:var(--mute);padding:12px 8px;}

/* dossier */
.dos{top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 142px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;}
.dos canvas{display:block;width:100%;height:190px;background:#010208;border-bottom:1px solid var(--edge);}
.dos .body{padding:14px 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.18em;display:flex;align-items:center;gap:7px;}
.kind .d{width:7px;height:7px;border-radius:50%;}
.dos h2{margin:-4px 0 0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.02;text-wrap:balance;}
.sub{color:var(--mute);margin-top:-6px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0;}
.stats div{min-width:0;}
.stats dt{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;line-height:1.5;}
.facts li{padding-left:14px;position:relative;}
.facts li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:1px;background:var(--accent);}
.plist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px;font-size:12px;}
.plist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--edge);padding:3px 0;min-width:0;}
.plist span:last-child{font-family:var(--mono);font-size:11px;color:var(--mute);}
.sec{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);margin-bottom:-4px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--edge);background:rgba(158,197,255,.06);border-radius:4px;padding:6px 11px;cursor:pointer;font-size:12px;letter-spacing:.03em;}
.btn:hover{border-color:var(--accent);}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--edge);background:rgba(3,5,11,.7);cursor:pointer;line-height:1;font-size:15px;}

/* bottom dock: time controls + tours */
.dock{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:6px;max-width:calc(100vw - 32px);box-sizing:border-box;z-index:2;}
.trow{display:flex;align-items:center;gap:6px;min-width:0;}
.tb{height:30px;min-width:34px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.tb.on{border-color:var(--accent);background:rgba(158,197,255,.16);}
.tread{display:flex;flex-direction:column;line-height:1.2;padding:0 8px;min-width:0;flex:1;}
.tread b{font-family:var(--mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tread span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#cosSlider{flex:2;min-width:120px;accent-color:#ffb36a;}
.tours{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:thin;}
.tours .btn{white-space:nowrap;}
.tours .lbl{align-self:center;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);padding:0 6px 0 4px;white-space:nowrap;}
.btn.sim{border-color:rgba(255,179,106,.45);color:#ffd9b0;}
.hint{position:fixed;bottom:calc(106px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:11px;color:var(--mute);pointer-events:none;white-space:nowrap;}

/* mode switch */
.modes{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;z-index:5;}
.modes button{border:0;background:transparent;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--mute);letter-spacing:.03em;white-space:nowrap;}
.modes button:hover{color:var(--ink);}
.modes button[aria-selected="true"]{background:rgba(158,197,255,.16);color:var(--ink);}
@media (min-width:761px) and (max-width:1220px){.modes{left:calc(302px + 16px + env(safe-area-inset-left,0px));transform:none;}}

/* toasts */
#toasts{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:6;width:min(420px,calc(100vw - 32px));}
.toast{width:100%;box-sizing:border-box;padding:10px 14px;background:rgba(6,9,20,.92);border:1px solid var(--edge);border-left:2px solid #ffb36a;border-radius:5px;display:flex;flex-direction:column;gap:2px;animation:tin .3s ease-out;}
.toast b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15;}
.toast span{font-size:12px;color:var(--mute);line-height:1.45;}
.toast.out{opacity:0;transition:opacity .5s;}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* sandbox + life panels */
.tip{margin:0;color:var(--mute);line-height:1.5;font-size:12px;}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.tool{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--edge);border-radius:4px;background:transparent;cursor:pointer;font-size:12px;text-align:left;min-width:0;}
.tool span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tool .d{width:9px;height:9px;border-radius:50%;flex:none;}
.tool[aria-pressed="true"]{border-color:var(--accent);background:rgba(158,197,255,.14);}
.scene{width:100%;display:flex;flex-direction:column;gap:2px;padding:7px 8px;border:0;border-radius:4px;background:transparent;cursor:pointer;text-align:left;}
.scene:hover{background:rgba(158,197,255,.07);}
.scene.sel{background:rgba(158,197,255,.14);}
.scene b{font-weight:500;font-size:13px;}
.scene span{font-size:11px;color:var(--mute);line-height:1.4;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;font-size:12px;}
.opt select{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--edge);border-radius:4px;font:inherit;padding:3px 6px;}
.sbstats{font-family:var(--mono);font-size:11px;color:var(--mute);padding:4px 8px 8px;line-height:1.6;font-variant-numeric:tabular-nums;}
.life{display:flex;flex-direction:column;gap:6px;border:1px solid var(--edge);border-radius:5px;padding:10px;}
.life .now{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.life .now b{font-weight:500;}
.life .now span{font-family:var(--mono);font-size:11px;color:var(--mute);}
.lbar{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;display:flex;}
.lbar i{display:block;height:100%;}
.lbar .mk{position:absolute;top:-2px;width:2px;height:12px;background:#fff;box-shadow:0 0 4px #fff;}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;}
.stages button{width:100%;display:flex;justify-content:space-between;gap:10px;padding:4px 6px;border:0;border-radius:3px;background:transparent;cursor:pointer;font-size:12px;text-align:left;}
.stages button:hover{background:rgba(158,197,255,.08);}
.stages button span:last-child{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;}
.stages button.past span:first-child{color:var(--mute);}
.epo .body{padding:16px;}
.catBtn{display:none;}

@media (max-width:760px){
  .head h1{font-size:24px;}
  .modes{top:calc(52px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));transform:none;justify-content:center;}
  .modes button{flex:1;padding:6px 6px;}
  #toasts{top:calc(98px + env(safe-area-inset-top,0px));}
  .dock{left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));transform:none;}
  .tread b{font-size:12px;}
  .trow{flex-wrap:wrap;}
  #cosSlider{order:9;flex-basis:100%;margin:2px 4px;}
  .epo{bottom:calc(146px + env(safe-area-inset-bottom,0px));}
  .catBtn{display:inline-block;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));}
  .cat{width:auto;right:calc(16px + env(safe-area-inset-right,0px));top:calc(100px + env(safe-area-inset-top,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:3;}
  .cat.closed{display:none;}
  .dos{top:auto;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));width:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:44%;z-index:4;}
  .dos canvas{height:130px;}
  .dos h2{font-size:26px;}
  .hint{display:none;}
}
@media (min-width:761px){.cat.closed{display:flex;}}
</style>
</head>
<body>

<canvas id="sky" aria-label="3D map of real stars, black holes, pulsars, nebulae and galaxies"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>

<div class="head">
  <h1>Deep Sky <i>Atlas</i></h1>
  <div class="scale" id="scale">View <b>–</b></div>
</div>
<button class="btn catBtn pane" id="catBtn" type="button" aria-expanded="false">Catalog</button>
<div class="pane modes" role="tablist" aria-label="Mode">
  <button type="button" role="tab" data-mode="atlas" aria-selected="true">Atlas</button>
  <button type="button" role="tab" data-mode="sandbox" aria-selected="false">Gravity sandbox</button>
  <button type="button" role="tab" data-mode="cosmic" aria-selected="false">Cosmic history</button>
</div>
<div id="toasts" aria-live="polite"></div>

<aside class="pane cat closed" id="cat" aria-label="Catalog">
  <div class="top">
    <input class="search" id="q" type="search" placeholder="Search Betelgeuse, TRAPPIST-1, Crab…" autocomplete="off" aria-label="Search objects">
    <div class="chips" id="chips"></div>
  </div>
  <ul class="list" id="list"></ul>
</aside>

<aside class="pane dos" id="dos" hidden aria-live="polite">
  <button class="x" id="close" type="button" aria-label="Close details">×</button>
  <canvas id="art" aria-hidden="true"></canvas>
  <div class="body" id="dbody"></div>
</aside>

<aside class="pane cat closed" id="sbPanel" hidden aria-label="Gravity sandbox">
  <div class="top">
    <div class="sec">Add to the sandbox</div>
    <p class="tip" id="sbTip">Pick an object, then tap empty space to put it in orbit, or drag to throw it.</p>
    <div class="tools" id="sbTools"></div>
  </div>
  <ul class="list" id="sbList"></ul>
</aside>

<aside class="pane dos epo" id="epo" hidden aria-live="polite">
  <div class="body" id="ebody"></div>
</aside>

<div class="hint" id="hint">Drag to orbit · scroll over an object to zoom into it · click to fly there</div>
<div class="pane dock" id="dock">
  <div class="trow">
    <button class="btn tb" id="tToday" type="button" title="Back to today">Today</button>
    <button class="btn tb" id="tRev" type="button" title="Run time backwards" aria-label="Run time backwards" aria-pressed="false">⇆</button>
    <button class="btn tb" id="tSlow" type="button" title="Slower" aria-label="Slower">−</button>
    <button class="btn tb" id="tPlay" type="button" title="Pause" aria-label="Pause">❚❚</button>
    <button class="btn tb" id="tFast" type="button" title="Faster" aria-label="Faster">+</button>
    <input type="range" id="cosSlider" min="0" max="1000" step="1" value="0" aria-label="Time since the Big Bang" hidden>
    <div class="tread"><b id="tDate">–</b><span id="tSpeed">–</span></div>
  </div>
  <nav class="tours" id="toursAtlas" aria-label="Quick tours">
  <span class="lbl">Go to</span>
  <button class="btn" data-go="Solar System" type="button">Solar System</button>
  <button class="btn" data-go="Sagittarius A*" type="button">Galactic core</button>
  <button class="btn" data-go="Orion Nebula" type="button">Orion Nebula</button>
  <button class="btn" data-go="TRAPPIST-1" type="button">TRAPPIST-1</button>
  <button class="btn" data-go="@milkyway" type="button">Whole Milky Way</button>
  <button class="btn" data-go="Andromeda Galaxy" type="button">Andromeda</button>
  <button class="btn" data-go="@random" type="button">Surprise me</button>
  <span class="lbl">Simulate</span>
  <button class="btn sim" data-sim="sn" type="button">Betelgeuse explodes</button>
  <button class="btn sim" data-sim="sun" type="button">The Sun's future</button>
  <button class="btn sim" data-sim="m31" type="button">Andromeda collision</button>
  </nav>
  <nav class="tours" id="toursSb" aria-label="Sandbox scenes" hidden></nav>
  <nav class="tours" id="toursCos" aria-label="Cosmic epochs" hidden></nav>
</div>

<script>
(function(){
"use strict";
/* ================= CATALOG (real positions: RA/Dec J2000 in degrees, distance in light-years) ================= */
const CATS={
  system:{label:'Planetary systems',one:'Planetary system',v:'--c-system'},
  star:{label:'Notable stars',one:'Star',v:'--c-star'},
  bh:{label:'Black holes',one:'Black hole',v:'--c-bh'},
  pulsar:{label:'Pulsars & neutron stars',one:'Neutron star',v:'--c-pulsar'},

};
const CAT_ORDER=['system','star','bh','pulsar','nebula','cluster','galaxy'];
const O=[
/* ---- planetary systems ---- */
{n:'Solar System',c:'system',ra:0,de:0,d:0,sub:'Our home · G2V yellow dwarf',col:'#fff0b0',
 p:[['Mercury',.39,'r'],['Venus',.72,'r'],['Earth',1,'r'],['Mars',1.52,'r'],['Jupiter',5.2,'g'],['Saturn',9.54,'g'],['Uranus',19.2,'i'],['Neptune',30.1,'i']],
 f:['The Sun is about 4.6 billion years old and holds 99.8% of the system\'s mass.','It orbits the centre of the Milky Way once every ~230 million years.','Voyager 1, the farthest spacecraft, is now over 160 AU away.']},

 f:['The closest star to the Sun.','Proxima b orbits in the habitable zone once every 11.2 days.','Frequent stellar flares bathe its planets in radiation.']},
{n:'Alpha Centauri A & B',c:'star',ra:219.900,de:-60.835,d:4.37,sub:'Sun-like binary · G2V + K1V',col:'#fff1c0',
 f:['A and B orbit each other every ~80 years; Proxima is a distant third member.','The closest Sun-like stars to us, visible as one bright point from the southern hemisphere.','JWST spotted a possible giant planet around A in 2025; it is still unconfirmed.']},
{n:'Barnard\'s Star',c:'system',ra:269.452,de:4.693,d:5.96,sub:'Red dwarf · M4V',col:'#ff8f63',
 p:[['Barnard d',.019,'r'],['Barnard b',.023,'r'],['Barnard c',.027,'r'],['Barnard e',.038,'r']],
 f:['The fastest-moving star across our sky.','Four small rocky planets were confirmed in 2024–2025.','All four orbit far closer than Mercury does to the Sun (orbits approximate).']},
{n:'Epsilon Eridani',c:'system',ra:53.233,de:-9.458,d:10.5,sub:'Young orange dwarf · K2V',col:'#ffc489',
 p:[['Eps Eri b',3.5,'g']],
 f:['A young star, under a billion years old, ringed by dusty debris belts.','Its Jupiter-like planet orbits every ~7 years.','A frequent setting in science fiction because it is so close.']},

/* ================= drawing helpers ================= */
function glow(g,x,y,rad,col,core){
  const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,'rgba(255,255,255,'+(core||1)+')');gr.addColorStop(.18,rgba(col,.9));gr.addColorStop(.45,rgba(col,.25));gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,7);g.fill();
}
function drawBH(g,x,y,R,tilt,t){
  // back half of disk
  g.save();g.translate(x,y);
  const ring=(from,to)=>{for(let i=0;i<4;i++){const rr=R*(1.6+i*.55);g.strokeStyle=`rgba(255,${150+i*20},${70+i*15},${.55-i*.11})`;g.lineWidth=R*(.42-i*.06);
    g.beginPath();g.ellipse(0,0,rr,rr*tilt,0,from,to);g.stroke();}};
  ring(Math.PI,Math.PI*2);
  // lensed halo above
  g.strokeStyle='rgba(255,190,120,.45)';g.lineWidth=R*.25;g.beginPath();g.ellipse(0,-R*.1,R*1.45,R*1.25,0,Math.PI*1.05,Math.PI*1.95);g.stroke();
  // photon ring + shadow
  const pr=g.createRadialGradient(0,0,R*.9,0,0,R*1.25);pr.addColorStop(0,'rgba(255,230,180,.95)');pr.addColorStop(1,'rgba(255,160,80,0)');
  g.fillStyle=pr;g.beginPath();g.arc(0,0,R*1.25,0,7);g.fill();
  g.fillStyle='#000';g.beginPath();g.arc(0,0,R,0,7);g.fill();
  ring(0,Math.PI);
  // doppler brightening on approaching side
  const db=g.createLinearGradient(-R*3,0,R*3,0);db.addColorStop(0,'rgba(255,240,210,.35)');db.addColorStop(.5,'rgba(255,240,210,0)');
  g.fillStyle=db;g.beginPath();g.ellipse(0,0,R*3.2,R*3.2*tilt,0,0,7);g.fill();
  g.restore();
}
function drawPulsar(g,x,y,R,t,spin,col){
  const a=t*Math.min(6,1.2/Math.max(spin,.2))+0.3;
  g.save();g.translate(x,y);
  g.strokeStyle=rgba(col,.15);g.lineWidth=1;
  for(let i=1;i<=3;i++){g.beginPath();g.ellipse(0,0,R*i*1.6,R*i*3.2,a*.25+.4,0,7);g.stroke();}
  g.rotate(a);
  for(const s of[1,-1]){const L=R*14;const gr=g.createLinearGradient(0,0,0,-L*s);gr.addColorStop(0,rgba(col,.75));gr.addColorStop(1,rgba(col,0));
    g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.lineTo(-R*1.8,-L*s);g.lineTo(R*1.8,-L*s);g.closePath();g.fill();}
  g.restore();
  glow(g,x,y,R*3.5,col,1);
}
function drawStarBall(g,x,y,R,col,t,seed,big){
  glow(g,x,y,R*2.6,col,.4);
  const gr=g.createRadialGradient(x-R*.25,y-R*.25,R*.1,x,y,R);gr.addColorStop(0,'#ffffff');gr.addColorStop(.45,col);gr.addColorStop(1,rgba(col,.55));
  g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill();
  if(big){const r=rng(seed);g.save();g.beginPath();g.arc(x,y,R,0,7);g.clip();g.globalCompositeOperation='multiply';
    for(let i=0;i<26;i++){const a=r()*7,rr=r()*R;blob(g,x+Math.cos(a)*rr,y+Math.sin(a)*rr,R*(.15+r()*.3),'#7a2a10',.35+.1*Math.sin(t+i));}g.restore();}
}
function drawSystem(g,o,x,y,maxR,starR,hl){
  for(const p of o.pl){if(p.gone)continue;
    const R=Math.sqrt(p.au/o.maxAU)*maxR;
    g.strokeStyle=p===hl?'rgba(127,216,189,.8)':p.kind==='c'?'rgba(158,197,255,.18)':'rgba(158,197,255,.3)';g.lineWidth=1;if(p.kind==='c')g.setLineDash([3,4]);
    g.beginPath();g.ellipse(x,y,R,R*.42,0,0,7);g.stroke();g.setLineDash([]);
    const a=plAngle(o,p),px=x+Math.cos(a)*R,py=y+Math.sin(a)*R*.42,pr=p.kind==='g'?3.6:p.kind==='i'?3:2.2;

function drawPlanetBall(g,x,y,R,col,lx,ly,ring){
  if(R<2.2){g.fillStyle=col;g.beginPath();g.arc(x,y,2,0,7);g.fill();return;}
  const l=Math.hypot(lx,ly)||1;lx/=l;ly/=l;
  const ringHalf=(a,b)=>{g.strokeStyle='rgba(232,216,170,.55)';g.lineWidth=R*.32;g.beginPath();g.ellipse(x,y,R*1.95,R*.55,-.3,a,b);g.stroke();
    g.strokeStyle='rgba(200,180,140,.35)';g.lineWidth=R*.12;g.beginPath();g.ellipse(x,y,R*2.35,R*.66,-.3,a,b);g.stroke();};
  if(ring)ringHalf(Math.PI,Math.PI*2);
  const gr=g.createRadialGradient(x+lx*R*.4,y+ly*R*.4,R*.05,x,y,R);gr.addColorStop(0,rgba(col,1));gr.addColorStop(.75,rgba(col,.9));gr.addColorStop(1,rgba(col,.6));
  g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill();
  g.save();g.beginPath();g.arc(x,y,R,0,7);g.clip();
  if(R>12&&(col==='#4f8fd8')){const r=rng(11);g.fillStyle='rgba(90,150,80,.8)';for(let i=0;i<7;i++){g.beginPath();g.arc(x+(r()-.5)*R*1.3,y+(r()-.5)*R*1.3,R*(.15+r()*.25),0,7);g.fill();}
    g.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<9;i++){g.beginPath();g.ellipse(x+(r()-.5)*R*1.6,y+(r()-.5)*R*1.6,R*(.2+r()*.3),R*.06,r(),0,7);g.fill();}}
  if(R>12&&(col==='#d9b58c'||col==='#e6d19a'||col==='#e6c08a')){g.translate(x,y);g.rotate(-.3);for(let i=-6;i<=6;i++){g.fillStyle=i%2?'rgba(120,80,40,.18)':'rgba(255,245,220,.12)';g.fillRect(-R,i*R*.16,R*2,R*.1);}g.setTransform(DPR,0,0,DPR,0,0);}
  const sh=g.createLinearGradient(x+lx*R,y+ly*R,x-lx*R,y-ly*R);sh.addColorStop(0,'rgba(0,0,8,0)');sh.addColorStop(.5,'rgba(0,0,8,.35)');sh.addColorStop(1,'rgba(0,0,8,.92)');
  g.fillStyle=sh;g.fillRect(x-R,y-R,R*2,R*2);g.restore();
  if(ring)ringHalf(0,Math.PI);
}
function drawOrbits3D(o){
  const ct=Math.cos(o.tilt),st=Math.sin(o.tilt);
  for(const pl of o.pl){if(pl.gone)continue;
    const R=pl.au*AU;ctx.strokeStyle=sel===pl?'rgba(127,216,189,.7)':pl.kind==='c'?'rgba(158,197,255,.2)':'rgba(158,197,255,.32)';ctx.lineWidth=1;
    if(pl.kind==='c')ctx.setLineDash([3,5]);
    ctx.beginPath();let pen=false;
    for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,x=Math.cos(a)*R,y=Math.sin(a)*R;const p=proj(o.pos[0]+x,o.pos[1]+y*ct,o.pos[2]+y*st);
      if(!p){pen=false;continue;}if(!pen){ctx.moveTo(p[0],p[1]);pen=true;}else ctx.lineTo(p[0],p[1]);}
    ctx.stroke();ctx.setLineDash([]);
  }
}

const SOFT={};
function softDot(col){if(SOFT[col])return SOFT[col];const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');blob(g,16,16,16,col,1);SOFT[col]=c;return c;}
function drawDeathNebula(o){
  const nb=o.st.neb,p=proj(o.pos[0],o.pos[1],o.pos[2]);if(!p)return;
  const key=nb.type;if(!o['neb_'+key])o['neb_'+key]=makeSprite({c:'nebula',shape:key==='pn'?'ring':'shell',seed:o.seed+7,col:key==='pn'?'#6fe0c8':'#ff8a5a',col2:key==='pn'?'#ff6a8a':'#7ab8ff',n:o.n},256);
  const pr=F*nb.r/p[2];if(pr<1.5)return;const s=Math.min(pr*2.3,Math.max(W,H)*6);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.max(0,Math.min(1,nb.a))*(pr>Math.max(W,H)?Math.max(.15,Math.max(W,H)/pr):1);
  ctx.drawImage(o['neb_'+key],p[0]-s/2,p[1]-s/2,s,s);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

function drawFlashes(){
  for(let i=flashes.length-1;i>=0;i--){const f=flashes[i],age=time-f.t0;if(age>4){flashes.splice(i,1);continue;}
    const p=proj(f.o.pos[0],f.o.pos[1],f.o.pos[2]);if(!p)continue;
    const k=Math.exp(-age*1.4),R=Math.min(Math.max(W,H)*1.2,40+age*260);
    ctx.globalCompositeOperation='lighter';blob(ctx,p[0],p[1],R,'#fff4e0',k);blob(ctx,p[0],p[1],R*.35,'#ffffff',k);
    if(p[0]>-50&&p[0]<W+50&&p[1]>-50&&p[1]<H+50){ctx.fillStyle=`rgba(255,246,230,${.35*Math.exp(-age*3)})`;ctx.fillRect(0,0,W,H);}
    ctx.globalCompositeOperation='source-over';}
}
function drawMerger(){

        const x=c[0]+side*u[0]*sv*Lt*(side>0?.6:1)+w[0]*side*sv*sv*Lt*.8+TAIL[b+2]*j*sv,y=c[1]+side*u[1]*sv*Lt*(side>0?.6:1)+w[1]*side*sv*sv*Lt*.8+TAIL[b+3]*j*sv,z=c[2]+side*u[2]*sv*Lt*.6+w[2]*side*sv*Lt*.5+TAIL[b+4]*j*sv;

/* ================= life-cycle panel in the dossier ================= */

  const bar=el('div','lbar');const ms=milestones(o),x0=-o.life[1],xs=[...ms.map(m=>m[0]),Math.max(o.deathX+.08,1.3)];
  const span=xs[xs.length-1];

  const mk=el('span','mk');bar.appendChild(mk);
  const list=el('ul','stages');const rows=[];
  const born=el('button');born.type='button';born.append(el('span',null,'Formed'),el('span',null,''));born.addEventListener('click',()=>jumpLife(o,-o.life[1]*o.T+o.T*.002));
  {const li=el('li');li.appendChild(born);list.appendChild(li);rows.push([0,born]);}
  ms.slice(1).forEach(m=>{const b=el('button');b.type='button';b.append(el('span',null,STG[m[1]]),el('span',null,''));b.addEventListener('click',()=>jumpLife(o,(m[0]-o.life[1])*o.T-(m[0]>=o.deathX?o.T*.0002:0)));
    const li=el('li');li.appendChild(b);list.appendChild(li);rows.push([m[0],b]);});
  const row=el('div','row');const ff=el('button','btn','Play its whole life');ff.type='button';

    if(life>1.4e10){toast(o.n.replace(' & B','')+' lives too long to show','Small stars like this shine for hundreds of billions to trillions of years, far longer than the universe has existed.');return;}
    simT=Math.max(T_MIN,-o.life[1]*o.T);tDir=1;let i=0;while(i<SPEEDS.length-1&&SPEEDS[i][0]*30<life)i++;

let boxes=[];
function tryLabel(text,x,y,col,bold,force){
  ctx.font=(bold?'600 12px ':'500 11px ')+'"IBM Plex Sans Condensed","Arial Narrow",sans-serif';
  const w=ctx.measureText(text).width+6,h=14,bx=x-w/2,by=y-h+2;
  if(!force)for(const b of boxes)if(bx<b[0]+b[2]&&bx+w>b[0]&&by<b[1]+b[3]&&by+h>b[1])return false;
  boxes.push([bx,by,w,h]);
  ctx.fillStyle='rgba(3,5,11,.55)';ctx.fillRect(bx,by,w,h);
  ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(text,x,y);return true;
}

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<2?1:m<5?2:5)*p;}
function ringScale(){

  const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts.push(projRel(tx+Math.cos(a)*R,ty+Math.sin(a)*R,tz));}
  ctx.strokeStyle='rgba(158,197,255,.14)';ctx.lineWidth=1;ctx.beginPath();let pen=false;
  for(const p of pts){if(!p){pen=false;continue;}if(!pen){ctx.moveTo(p[0],p[1]);pen=true;}else ctx.lineTo(p[0],p[1]);}ctx.stroke();
  const lp=projRel(tx+R*Math.cos(cam.yaw+Math.PI*.5),ty+R*Math.sin(cam.yaw+Math.PI*.5),tz);
  if(lp){ctx.font='400 10px "IBM Plex Mono",ui-monospace,monospace';ctx.fillStyle='rgba(158,197,255,.55)';ctx.textAlign='center';ctx.fillText('radius '+scaleFmt(R),lp[0],lp[1]-4);}
}
const scaleEl=document.getElementById('scale');let lastHud='';

function sbLeap(dt){

    const big=a.m>=b.m?a:b,lit=big===a?b:a;

function merge(a,b){
  const m=a.m+b.m,big=a.m>=b.m?a:b,lit=big===a?b:a;

  big.x=(a.x*a.m+b.x*b.m)/m;big.y=(a.y*a.m+b.y*b.m)/m;big.z=(a.z*a.m+b.z*b.m)/m;
  big.vx=(a.vx*a.m+b.vx*b.m)/m;big.vy=(a.vy*a.m+b.vy*b.m)/m;big.vz=(a.vz*a.m+b.vz*b.m)/m;
  big.m=m;big.type=type;big.r=bodyRadius(type,m);if(type!=='planet'||big.type!==a.type)big.col=bodyColor(type,m);
  SB.bodies.splice(SB.bodies.indexOf(lit),1);if(SB.sel===lit)SB.sel=big;
  SB.flashes.push({x:big.x,y:big.y,z:big.z,t0:time,k:RANK[lit.type]>=2?1:.4});

  else if(lit.type==='planet')toast(lit.name?lit.name+' is destroyed':'A planet is destroyed','It crashed into '+(big.name||('a '+big.type))+'.');
  else toast((lit.name||'A '+lit.type)+' merges with '+(big.name||'a '+big.type),big.type==='bh'?'Swallowed whole. The black hole now has '+fmtMass(big.m)+'.':'The two combine into one heavier object.');

}
function disrupt(star,bh){
  const r=rng((SB.t*1e6)|0);

    addParticle(star.x+x*star.r,star.y+y*star.r,star.z+z*star.r*.5,star.vx,star.vy,star.vz,0);}

}
function fmtMass(m){m*=SB.mUnit;return m>=1e6?(m>=1e9?(m/1e9).toFixed(1)+' billion':(m/1e6).toFixed(1)+' million')+' Suns':m>=.08?(+m.toPrecision(3)).toLocaleString()+' Suns':m>=1e-4?(m/9.55e-4).toFixed(2)+' Jupiters':(m/3e-6).toFixed(2)+' Earths';}

function sbCOM(){let m=0,x=0,y=0,z=0;for(const b of SB.bodies){m+=b.m;x+=b.x*b.m;y+=b.y*b.m;z+=b.z*b.m;}return m?[x/m,y/m,z/m]:null;}

/* ---- placing and throwing ---- */
function screenToPlane(sx,sy){
  const dx=B.fx*F+B.rx*(sx-W/2)-B.ux*(sy-H/2),dy=B.fy*F+B.ry*(sx-W/2)-B.uy*(sy-H/2),dz=B.fz*F-B.uz*(sy-H/2);
  const Px=B.ox+B.cx,Py=B.oy+B.cy,Pz=B.oz+B.cz;if(Math.abs(dz)<1e-9)return null;const t=(cam.tz-Pz)/dz;if(!(t>0))return null;

function toolDef(){return TOOLS.find(t=>t.id===SB.tool);}
function orbitVelAt(p){
  let best=null,bf=0;for(const b of SB.bodies){const d2=(b.x-p[0])**2+(b.y-p[1])**2+(b.z-p[2])**2+1e-12,f=b.m/d2;if(f>bf){bf=f;best=b;}}

  const b=addBody({name:t.label,type:t.type,m,x:p[0],y:p[1],z:p[2],vx:v[0],vy:v[1],vz:v[2],col:t.col});
  b.name=t.label+' '+(SB.bodies.filter(x=>x.name&&x.name.startsWith(t.label)).length);sbPanelStats();}
function throwVel(a,b){const T=2*Math.max(SB.speed,1e-6);return [(b[0]-a[0])/T,(b[1]-a[1])/T,0];}
function previewPath(p,v){
  const bs=SB.bodies.map(b=>({x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,m:b.m}));const t=toolDef(),me={x:p[0],y:p[1],z:p[2],vx:v[0],vy:v[1],vz:v[2],m:t.m/SB.mUnit};bs.push(me);
  const steps=500,dt=3*Math.max(SB.speed,1e-6)/steps,e2=SB.eps*SB.eps,out=[];
  const acc=()=>{for(const b of bs){b.ax=b.ay=b.az=0;}for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const a=bs[i],b=bs[j],dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,r2=dx*dx+dy*dy+dz*dz+e2,inv=G4/(r2*Math.sqrt(r2));a.ax+=dx*inv*b.m;a.ay+=dy*inv*b.m;a.az+=dz*inv*b.m;b.ax-=dx*inv*a.m;b.ay-=dy*inv*a.m;b.az-=dz*inv*a.m;}};
  acc();for(let s=0;s<steps;s++){for(const b of bs){b.vx+=b.ax*dt/2;b.vy+=b.ay*dt/2;b.vz+=b.az*dt/2;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;}acc();for(const b of bs){b.vx+=b.ax*dt/2;b.vy+=b.ay*dt/2;b.vz+=b.az*dt/2;}

/* ---- drawing ---- */
function drawSky(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#03050b';ctx.fillRect(0,0,W,H);
  for(let i=0;i<FAR.length;i+=4){const X=FAR[i],Y=FAR[i+1],Z=FAR[i+2];const zc=X*B.fx+Y*B.fy+Z*B.fz;if(zc<=.05)continue;

}

  for(let c=0;c<4;c++){ctx.fillStyle=rgba(PCOL_SB[c],c===0?.85:.6);const s=c===0?1.8:1.5;
    for(let i=0;i<SB.np;i++){if(SB.pc[i]!==c)continue;const k=i*3,p=proj(SB.px[k],SB.px[k+1],SB.px[k+2]);if(p)ctx.fillRect(p[0]-s/2,p[1]-s/2,s,s);}}
  ctx.globalCompositeOperation='source-over';
  const items=[];for(const b of bs){const p=proj(b.x,b.y,b.z);if(p)items.push([b,p]);}
  items.sort((a,b)=>b[1][2]-a[1][2]);
  let lightSrc=null;for(const b of bs)if((b.type==='star'||b.type==='core')&&(!lightSrc||b.m>lightSrc.m))lightSrc=b;
  for(const [b,p] of items){const [x,y,z]=p,pr=F*b.r/z;let r;
    if(b.type==='star'){r=Math.max(3.2,pr);if(pr>3.4)drawStarBall(ctx,x,y,pr,b.col,time,b.id*97,pr>30);else glow(ctx,x,y,Math.max(7,5+3*Math.log10(1+b.m*SB.mUnit*4)),b.col,1);}

    else if(b.type==='bh'){r=Math.max(b.m*SB.mUnit>1e4?9:5,Math.min(60,pr*2.6));drawBH(ctx,x,y,r,.32,time);}

    else{r=Math.max(2.5,pr);let lx=-1,ly=0;if(lightSrc){const q=proj(lightSrc.x,lightSrc.y,lightSrc.z);if(q){lx=q[0]-x;ly=q[1]-y;}}drawPlanetBall(ctx,x,y,r,b.col,lx,ly,b.name&&b.name.startsWith('Saturn'));}
    if(SB.sel===b){ctx.strokeStyle='#9ec5ff';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,Math.min(r*(b.type==='bh'?3.4:1.2)+9,H*.45),time*.4,time*.4+7);ctx.stroke();ctx.setLineDash([]);}

  if(bs.length<=14)for(const [b,p] of items){if(!b.name)continue;const sObj=screenObjs.find(s=>s.o===b);tryLabel(b.name,p[0],p[1]+Math.min(sObj.r*(b.type==='bh'?3.6:1.1),H*.4)+18,SB.sel===b?'#fff':'rgba(190,205,235,.85)',SB.sel===b,false);}

    if(a){const t=toolDef();glow(ctx,a[0],a[1],8,t.col||bodyColor(t.type,t.m/SB.mUnit),1);}
    if(a&&b){ctx.strokeStyle='#ffd9b0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();const an=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-9*Math.cos(an-.4),b[1]-9*Math.sin(an-.4));ctx.lineTo(b[0]-9*Math.cos(an+.4),b[1]-9*Math.sin(an+.4));ctx.closePath();ctx.fillStyle='#ffd9b0';ctx.fill();ctx.lineWidth=1;}}
  for(let i=SB.flashes.length-1;i>=0;i--){const f=SB.flashes[i],age=time-f.t0;if(age>2.5){SB.flashes.splice(i,1);continue;}const p=proj(f.x,f.y,f.z);if(!p)continue;
    ctx.globalCompositeOperation='lighter';blob(ctx,p[0],p[1],20+age*140*f.k,'#fff1d6',Math.exp(-age*2)*f.k);ctx.globalCompositeOperation='source-over';}

}

  if(mode===5){kind={cloud:0,ring:1,shell:2,bipolar:3,dark:4}[f.shape]||0;c1=hex3(f.col);c2=hex3(f.col2);}
  gl.uniform1f(U.uKind,kind);gl.uniform3f(U.uC1,c1[0],c1[1],c1[2]);gl.uniform3f(U.uC2,c2[0],c2[1],c2[2]);gl.uniform3f(U.uAtm,atm[0],atm[1],atm[2]);
  gl.uniform1f(U.uSpin,spin);gl.uniform1f(U.uRing,ring);gl.uniform1f(U.uExtra,extra);gl.uniform1f(U.uGran,gran);gl.uniform3f(U.uL,L[0],L[1],L[2]);
  gl.uniform1f(U.uPx,Math.max(1e-4,1.6*z/unit/(F*DPR*glQ)));gl.uniform1f(U.uExp,mode===1&&f.big?1.05:1.6);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ================= modes ================= */
const camStore={},HINTS={atlas:'Drag to orbit · scroll over an object to zoom into it · click to fly there',sandbox:'Pick an object on the left, then tap to orbit or drag to throw · space bar pauses',cosmic:'Drag to orbit · scroll to zoom · drag the timeline to travel through cosmic time'};
const sbPanelEl=document.getElementById('sbPanel'),epoEl=document.getElementById('epo');
function setMode(m){
  if(m===MODE)return;
  camStore[MODE]={cam:{...cam},focus};
  MODE=m;fly=null;SB.drag=null;SB.preview=null;hover=null;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
  const A=m==='atlas',S=m==='sandbox',C=m==='cosmic';
  catEl.hidden=!A;dos.hidden=!A||!sel;sbPanelEl.hidden=!S;epoEl.hidden=!C;
  document.getElementById('toursAtlas').hidden=!A;document.getElementById('toursSb').hidden=!S;document.getElementById('toursCos').hidden=!C;
  tRevB.hidden=!A;document.getElementById('cosSlider').hidden=!C;document.getElementById('tToday').textContent=S?'Restart':'Today';
  document.getElementById('tToday').title=S?'Restart this scene':A?'Back to today':'Jump to today';
  document.getElementById('hint').textContent=HINTS[m];
  catBtn.style.visibility=C?'hidden':'visible';catBtn.textContent=S?'Tools':'Catalog';
  if(innerWidth<=760){sidePanel().classList.add('closed');catBtn.setAttribute('aria-expanded','false');}
  const st=camStore[m];
  if(A){focus=st?st.focus:focus;if(st)Object.assign(cam,st.cam);if(sel)requestAnimationFrame(sizeArt);}
  if(S){focus=null;if(!SB.loaded){SB.loaded=true;sbLoad('solar');}else if(st)Object.assign(cam,st.cam);}
  if(C){focus=null;if(st)Object.assign(cam,st.cam);else{cam.yaw=-2.3;cam.pitch=.38;}COS.ep=-1;
    if(!st){COS.u=0;COS.play=true;}}
  if(glW){glc.width=glc.height=1;glW=0;}
  lastHud='';lastDateTxt='';syncTimeUI();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* ================= loop ================= */
let last=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;idle+=dt;
  if(MODE==='atlas'){
    stepAtlasTime(dt);applySim();updPlanets();
    stepFly(dt);
    if(focus&&focus.isPlanet){const a=plAngle(focus.parent,focus);if(focus._la!=null&&!fly){let d=a-focus._la;d-=Math.round(d/(2*Math.PI))*2*Math.PI;if(Math.abs(d)<.4)cam.yaw+=d;}focus._la=a;}
    if(!fly&&focus){cam.tx=focus.pos[0];cam.ty=focus.pos[1];cam.tz=focus.pos[2];if(cam.dist<minDist())cam.dist=minDist();}
    if(!reduce&&!fly&&idle>5&&ptrs.size===0)cam.yaw+=dt*.025;
    draw();glRender();drawArt();
  }else if(MODE==='sandbox'){
    if(SB.play)sbAdvance(SB.speed*dt);
    for(const b of SB.bodies){const tr=b.trail,l=tr[tr.length-1];if(!l||l[0]!==b.x||l[1]!==b.y){tr.push([b.x,b.y,b.z]);if(tr.length>(b.type==='core'?500:320))tr.shift();}}
    sbCamFollow(dt);drawSandbox();
  }else{
    cosStep(dt);if(!reduce&&idle>4&&ptrs.size===0)cam.yaw+=dt*.04;drawCosmic();
  }
  uiT+=dt;if(uiT>.2){uiT=0;tickTimeLabel();if(MODE==='atlas')updLifeUI();else if(MODE==='sandbox')sbPanelStats();else updEpoch();}
  requestAnimationFrame(frame);
}
function start(data){
  if(data&&data.cam)Object.assign(cam,data.cam);
  if(innerWidth>760)toggleCat(true);
  applySim();updPlanets();
  renderList();
  if(data&&data.sel!=null&&O[data.sel])select(O[data.sel],false);
  else select(O.find(o=>o.n==='Orion Nebula'),false);
  syncTimeUI();
  if(data&&data.mode&&data.mode!=='atlas')setMode(data.mode);
  requestAnimationFrame(t=>{last=t;frame(t);});
}
start({});
})();
</script>
